<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Tarik Lagi drawings. One language for the whole page: flat filled shapes, no outlines, every part
       built from bands with round ends (the tea stream), light shown by flat tone steps, never gradients.
       Colours come from the page's tokens through var(); the fallbacks are the same values, so this file
       also draws on its own. No brand marks on any vessel.
       This file is XML: a double hyphen inside a comment stops the browser reading it, so name the custom
       properties in words here, never with their two leading hyphens. -->
  <defs>
    <!-- The steel pulling mug, drawn upright with its lip (where the tea leaves) at 0,0.
         The page tilts it with rotate(100) so the mouth faces the glass. -->
    <g id="steel-mug">
      <path d="M-112 28C-166 28-166 106-112 106" style="fill:none;stroke:var(--steel-shade,#5d574d);stroke-width:16;stroke-linecap:round"/>
      <path d="M-112 0H0V108A26 26 0 0 1-26 134H-86A26 26 0 0 1-112 108Z" style="fill:var(--steel,#887f72)"/>
      <path d="M-24 0H0V108A26 26 0 0 1-24 133.92Z" style="fill:var(--steel-shade,#5d574d)"/>
      <rect x="-96" y="14" width="20" height="104" rx="10" style="fill:var(--steel-lit,#bcb29f)"/>
      <rect x="-68" y="22" width="6" height="88" rx="3" style="fill:var(--steel-lit,#bcb29f)"/>
      <circle cx="-104" cy="32" r="4" style="fill:var(--steel-shade,#5d574d)"/>
      <circle cx="-104" cy="102" r="4" style="fill:var(--steel-shade,#5d574d)"/>
      <rect x="-118" y="-8" width="124" height="14" rx="7" style="fill:var(--steel-lit,#bcb29f)"/>
      <rect x="-30" y="-6" width="34" height="12" rx="6" style="fill:var(--tea,#6b4226)"/>
    </g>

    <!-- The glass mug: rim at y 0, 120 wide and 170 tall, handle on the right, thick pressed base. -->
    <g id="glass">
      <path d="M116 36C166 36 166 120 116 120" style="fill:none;stroke:var(--glass-shade,#d0bca3);stroke-width:16;stroke-linecap:round"/>
      <path d="M0 0H120V150A20 20 0 0 1 100 170H20A20 20 0 0 1 0 150Z" style="fill:var(--glass,#ddccb3)"/>
      <rect x="6" y="156" width="108" height="8" rx="4" style="fill:var(--glass-shade,#d0bca3)"/>
      <rect x="8" y="-3" width="46" height="6" rx="3" style="fill:var(--foam,#f7f0e3)"/>
    </g>

    <!-- What is in the glass: tea lit on the left and shaded on the right, with air rising just under the foam.
         Drawn after the foam, so it hides the foam's lower edge. -->
    <g id="glass-drink">
      <path d="M6 58H114V140A14 14 0 0 1 100 154H20A14 14 0 0 1 6 140Z" style="fill:var(--tea,#6b4226)"/>
      <path d="M90 58H114V140A14 14 0 0 1 100 154H90Z" style="fill:var(--tea-shade,#583822)"/>
      <rect x="16" y="66" width="12" height="80" rx="6" style="fill:var(--tea-lit,#7f5a3f)"/>
      <rect x="34" y="70" width="5" height="68" rx="2.5" style="fill:var(--tea-lit,#7f5a3f)"/>
      <circle cx="48" cy="64" r="2.5" style="fill:var(--foam,#f7f0e3)"/>
      <circle cx="64" cy="61" r="2" style="fill:var(--foam,#f7f0e3)"/>
      <circle cx="80" cy="66" r="2.5" style="fill:var(--foam,#f7f0e3)"/>
      <circle cx="102" cy="62" r="2" style="fill:var(--foam,#f7f0e3)"/>
    </g>

    <!-- The menu cups share one frame, viewBox="-20 -64 200 240": the glass mug sits where it is drawn
         above, and every vessel stands on the mug's table line, y 170. A drink other than tea recolours
         #glass-drink and #tall-drink through the three tea custom properties, set on the cup in site.css. -->

    <!-- The foam on the glass mug as it sits at the end of the pull (the page's t = 1 pose), for the menu.
         The hero and the order glass draw their own foam, so the motion layer can raise it. -->
    <g id="glass-foam">
      <rect x="6" y="-14" width="108" height="88" rx="14" style="fill:var(--foam,#f7f0e3)"/>
      <rect x="86" y="0" width="28" height="58" style="fill:var(--foam-shade,#e6d7bf)"/>
      <g style="fill:var(--foam-shade,#e6d7bf)">
        <circle cx="22" cy="4" r="4"/><circle cx="40" cy="20" r="3"/><circle cx="76" cy="0" r="3.5"/>
        <circle cx="66" cy="26" r="4"/><circle cx="52" cy="40" r="2.5"/><circle cx="28" cy="44" r="3"/>
        <circle cx="80" cy="44" r="2.5"/>
      </g>
    </g>

    <!-- A knob of fresh ginger lying in front of the mug (teh halia): a fat body and two knobs, rings on
         the skin, a shaded underside and the pale yellow cut face at one end. Drawn large on purpose, so
         it still reads at the menu's 52px. -->
    <g id="ginger">
      <g style="fill:var(--ginger,#c49a5c)">
        <rect x="-3" y="108" width="26" height="48" rx="13" transform="rotate(-20 10 150)"/>
        <rect x="36" y="120" width="24" height="36" rx="12" transform="rotate(24 48 152)"/>
        <rect x="-16" y="140" width="84" height="30" rx="15"/>
      </g>
      <g style="fill:var(--ginger-shade,#9a7444)">
        <rect x="-6" y="160" width="64" height="10" rx="5"/>
        <rect x="14" y="144" width="3.5" height="20" rx="1.75"/>
        <rect x="32" y="145" width="3.5" height="18" rx="1.75"/>
        <rect x="0" y="124" width="20" height="3.5" rx="1.75" transform="rotate(-20 10 150)"/>
      </g>
      <circle cx="56" cy="155" r="9" style="fill:var(--ginger-flesh,#ecd68f)"/>
    </g>

    <!-- The tall glass for the iced drinks: no handle, rim at y -40, thick pressed base. It is centred on
         the mug's body (x 60), so the cups line up down the menu and only the handles stick out. -->
    <g id="tall-glass">
      <path d="M8-40H112V150A20 20 0 0 1 92 170H28A20 20 0 0 1 8 150Z" style="fill:var(--glass,#ddccb3)"/>
      <rect x="14" y="156" width="92" height="8" rx="4" style="fill:var(--glass-shade,#d0bca3)"/>
      <rect x="16" y="-43" width="40" height="6" rx="3" style="fill:var(--foam,#f7f0e3)"/>
    </g>

    <!-- An iced drink in the tall glass: lit on the left, shaded on the right, a lit surface, and five ice
         cubes. The ice is condensed milk at 40%, so every drink shows through its own ice. -->
    <g id="tall-drink">
      <path d="M14-26H106V140A14 14 0 0 1 92 154H28A14 14 0 0 1 14 140Z" style="fill:var(--tea,#6b4226)"/>
      <path d="M86-26H106V140A14 14 0 0 1 92 154H86Z" style="fill:var(--tea-shade,#583822)"/>
      <rect x="22" y="-14" width="10" height="152" rx="5" style="fill:var(--tea-lit,#7f5a3f)"/>
      <rect x="38" y="-8" width="4" height="138" rx="2" style="fill:var(--tea-lit,#7f5a3f)"/>
      <rect x="14" y="-28" width="92" height="6" rx="3" style="fill:var(--tea-lit,#7f5a3f)"/>
      <g style="fill:var(--foam,#f7f0e3)">
        <g transform="rotate(-8 35 -4)"><rect x="20" y="-19" width="30" height="30" rx="6" fill-opacity=".4"/><rect x="24" y="-15" width="12" height="4" rx="2"/></g>
        <g transform="rotate(14 73 2)"><rect x="58" y="-13" width="30" height="30" rx="6" fill-opacity=".4"/><rect x="62" y="-9" width="12" height="4" rx="2"/></g>
        <g transform="rotate(6 47 38)"><rect x="32" y="23" width="30" height="30" rx="6" fill-opacity=".4"/><rect x="36" y="27" width="12" height="4" rx="2"/></g>
        <g transform="rotate(-12 78 74)"><rect x="64" y="60" width="28" height="28" rx="6" fill-opacity=".4"/><rect x="68" y="64" width="11" height="4" rx="2"/></g>
        <g transform="rotate(10 39 106)"><rect x="25" y="92" width="28" height="28" rx="6" fill-opacity=".4"/><rect x="29" y="96" width="11" height="4" rx="2"/></g>
      </g>
    </g>

    <!-- Foam on the tall glass (teh tarik ais). Drawn after the drink, so it hides the drink's surface;
         the air rises just under it. -->
    <g id="tall-foam">
      <path d="M14 0V-40A14 14 0 0 1 28-54H92A14 14 0 0 1 106-40V0Z" style="fill:var(--foam,#f7f0e3)"/>
      <rect x="84" y="-40" width="22" height="40" style="fill:var(--foam-shade,#e6d7bf)"/>
      <g style="fill:var(--foam-shade,#e6d7bf)">
        <circle cx="28" cy="-40" r="3.5"/><circle cx="44" cy="-26" r="3"/><circle cx="68" cy="-44" r="3"/>
        <circle cx="60" cy="-18" r="3.5"/><circle cx="32" cy="-10" r="2.5"/><circle cx="74" cy="-8" r="2.5"/>
      </g>
      <g style="fill:var(--foam,#f7f0e3)">
        <circle cx="30" cy="6" r="2.5"/><circle cx="48" cy="4" r="2"/><circle cx="70" cy="8" r="2.5"/><circle cx="94" cy="5" r="2"/>
      </g>
    </g>

    <!-- A slice of lime on the rim of the tall glass (teh O ais limau): rind, pith, and flesh in eight segments. -->
    <g id="lime">
      <circle cx="104" cy="-40" r="20" style="fill:var(--lime,#6f9a2c)"/>
      <circle cx="104" cy="-40" r="16.5" style="fill:var(--foam,#f7f0e3)"/>
      <circle cx="104" cy="-40" r="14.5" style="fill:var(--lime-lit,#c5d66a)"/>
      <g style="fill:var(--foam,#f7f0e3)">
        <rect x="89" y="-41.25" width="30" height="2.5" rx="1.25"/>
        <rect x="89" y="-41.25" width="30" height="2.5" rx="1.25" transform="rotate(45 104 -40)"/>
        <rect x="89" y="-41.25" width="30" height="2.5" rx="1.25" transform="rotate(90 104 -40)"/>
        <rect x="89" y="-41.25" width="30" height="2.5" rx="1.25" transform="rotate(135 104 -40)"/>
        <circle cx="104" cy="-40" r="2.5"/>
      </g>
    </g>
  </defs>
</svg>
